name: Vigilar buses

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:
    inputs:
      rounds:
        description: "Rondas de comprobación"
        default: "1"
      test_telegram:
        description: "Enviar solo un mensaje de prueba a Telegram"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: vigilar
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Comprobar ALSA
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          ROUNDS: ${{ github.event.inputs.rounds || '4' }}
          ROUND_GAP: "120"
          TEST_TELEGRAM: ${{ github.event.inputs.test_telegram || 'false' }}
        run: |
          git config user.name "vigia-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          python checker.py
