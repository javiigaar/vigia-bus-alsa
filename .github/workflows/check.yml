name: Vigilar buses

# Una ejecución larga (modo vigilante) comprueba cada 2 min durante ~5h40 y al acabar se relanza sola.
# El cron es solo un respaldo por si la cadena se rompe. No hace falta comprobar si ya hay uno activo:
# el grupo de concurrencia deja como mucho una ejecución en cola (la más nueva) y la lanza al terminar la actual.
on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:
    inputs:
      mode:
        description: "vigilante = bucle largo, una = una sola comprobación"
        default: "vigilante"
      test_telegram:
        description: "Enviar solo un mensaje de prueba a Telegram"
        type: boolean
        default: false

permissions:
  contents: write
  actions: write

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    concurrency:
      group: vigilar
      cancel-in-progress: false
    env:
      GH_TOKEN: ${{ github.token }}
      MODE: ${{ github.event.inputs.mode || 'vigilante' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Comprobar ALSA
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TEST_TELEGRAM: ${{ github.event.inputs.test_telegram || 'false' }}
          MAX_MINUTES: ${{ env.MODE == 'vigilante' && '340' || '0' }}
          ROUND_GAP: "120"
        run: |
          git config user.name "vigia-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          python checker.py
      - name: Relanzar el vigilante
        if: always() && env.MODE == 'vigilante' && github.event.inputs.test_telegram != 'true'
        run: gh workflow run check.yml -R "$GITHUB_REPOSITORY" --ref main -f mode=vigilante
